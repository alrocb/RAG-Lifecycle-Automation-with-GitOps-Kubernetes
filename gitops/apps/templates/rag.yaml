# La aplicación RAG: chart de charts/rag con los valores del entorno y sus secretos cifrados.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: charts/rag
      helm:
        valueFiles:
          - $repo/gitops/rag/values.yaml
        # El nombre depende de la IP del entorno: lo recibe la aplicación raíz desde Terraform.
        valuesObject:
          host: {{ .Values.host | quote }}
          ingest:
            bucket: {{ .Values.materialsBucket | quote }}
            region: {{ .Values.awsRegion | quote }}
    # Solo para que $repo apunte a este repositorio en valueFiles.
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      ref: repo
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/rag/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
